# Only the nodes added with ./broker.sh may connect, and each one may only use the team topic.
listener 1883
allow_anonymous false
password_file /mosquitto/security/passwd
acl_file /mosquitto/security/acl
persistence true
persistence_location /mosquitto/data/
# The TLS listener, written by ./broker.sh tls.
include_dir /mosquitto/security/conf.d
