[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healer"
version = "0.1.0"
description = "Local-first autonomous code remediation system"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "GitPython>=3.1",
    "paho-mqtt>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]

[project.scripts]
healer = "healer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/healer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["integration: touches Chroma on a temporary path or other real infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "tree_sitter_python.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/healer"]

[tool.coverage.report]
fail_under = 75
