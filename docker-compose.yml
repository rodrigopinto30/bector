x-healer: &healer
  build: .
  env_file: .env
  environment:
    MQTT_HOST: mosquitto
    MQTT_PORT: 1883
    CHROMA_PATH: /data/chroma
    LEDGER_PATH: /data/healer/ledger.sqlite3
  volumes:
    - .:/app
    - chroma-data:/data/chroma
    - chroma-models:/root/.cache/chroma
    - healer-data:/data/healer
    - ${WORKSPACE_PATH:-./workspace}:/workspace
  working_dir: /workspace
  depends_on:
    - mosquitto
  restart: unless-stopped

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: healer-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  healer:
    <<: *healer
    container_name: healer-app

  listener:
    <<: *healer
    container_name: healer-listener
    profiles: ["team"]
    command: ["healer", "listen"]

volumes:
  mosquitto-data:
  chroma-data:
  chroma-models:
  healer-data:
